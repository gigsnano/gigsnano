[project]
name = "gigsnano-api"
version = "0.1.0"
license = "AGPL-3.0-only"
description = "GigsNano backend — PM domain API + BMAD orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "pwdlib[argon2]>=0.2",
    "pyyaml>=6.0.3",
    "markitdown[pdf,docx]>=0.1.6",
    "anthropic>=0.115.1",
    "cryptography>=49.0.0",
    "httpx>=0.28.1",
    "google-auth>=2.55.1",
    "requests>=2.34.2",
    "stripe>=11.0",
    "azure-communication-email>=1.0.0",
    "mcp>=1.2",
    "slowapi>=0.1.10",
    "openpyxl>=3.1.5",
    "pydbml>=1.2.1",
    "lizard>=1.23.0",
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=0.7",
    "falkordb>=1.0",
    "protobuf>=5",
    # zoneinfo has no tz database of its own — it reads the host's. Windows ships
    # none and slim/alpine images may not either, so the per-user digest schedule
    # (GIN-124/125) would resolve zero zones. Pin it here rather than inherit it
    # from whatever the base image happens to carry.
    "tzdata>=2024.1",
    "markdown-it-py>=4.2.0",
    "mdit-py-plugins>=0.6.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "ruff>=0.5",
    "pre-commit>=4",
    "pyright>=1.1",
    "grpcio-tools>=1.82.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gigsnano_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore:Field name \"json\" in .* shadows an attribute in parent \"BaseModel\":UserWarning",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
include = ["src"]
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
