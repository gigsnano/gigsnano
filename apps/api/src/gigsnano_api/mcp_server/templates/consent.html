<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Authorize GigsNano MCP</title>
  <style>
    :root {{
      color-scheme: light dark;
      --bg: #fafafa;
      --card: #ffffff;
      --text: #111111;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #111111;
      --accent-fg: #ffffff;
      --deny: #f3f4f6;
    }}
    @media (prefers-color-scheme: dark) {{
      --bg: #0a0a0a;
      --card: #171717;
      --text: #fafafa;
      --muted: #a3a3a3;
      --border: #262626;
      --accent: #fafafa;
      --accent-fg: #111111;
      --deny: #262626;
    }}
    * {{ box-sizing: border-box; }}
    body {{
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }}
    .card {{
      width: 100%;
      max-width: 26rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    }}
    .brand {{
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }}
    h1 {{
      font-size: 1.125rem;
      font-weight: 600;
      line-height: 1.4;
      margin: 0 0 0.75rem;
    }}
    .user {{
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1rem;
      line-height: 1.5;
    }}
    .user strong {{ color: var(--text); }}
    .switch {{
      display: inline-block;
      margin-top: 0.25rem;
      font-size: 0.8125rem;
      color: var(--muted);
    }}
    .switch a {{ color: var(--text); }}
    .scopes {{
      margin: 0 0 1.25rem;
      padding: 0.75rem 0.75rem 0.75rem 2rem;
      background: var(--bg);
      border-radius: 0.5rem;
      font-size: 0.875rem;
      line-height: 1.5;
    }}
    .scopes li {{ margin: 0.25rem 0; }}
    .actions {{ display: flex; gap: 0.75rem; }}
    button {{
      flex: 1;
      padding: 0.625rem 1rem;
      border-radius: 0.5rem;
      border: none;
      font-size: 0.9375rem;
      font-weight: 500;
      cursor: pointer;
    }}
    .approve {{ background: var(--accent); color: var(--accent-fg); }}
    .deny {{ background: var(--deny); color: var(--text); }}
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">GigsNano</div>
    <h1><strong>{client_name}</strong> wants to access your GigsNano work items as <strong>{user_display}</strong></h1>
    <p class="user">
      Signed in as <strong>{user_email}</strong>
      <span class="switch">Not you? <a href="{switch_account_url}">Switch account</a></span>
    </p>
    <ul class="scopes">{scope_list}</ul>
    <form method="post">
      {hidden_fields}
      <div class="actions">
        <button type="submit" name="approve" value="1" class="approve">Approve</button>
        <button type="submit" class="deny">Deny</button>
      </div>
    </form>
  </div>
</body>
</html>
