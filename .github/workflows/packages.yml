name: Packages

on:
  pull_request:
    paths: ["packages/**", "pnpm-lock.yaml", ".github/workflows/packages.yml"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ["@gigsnano/core", "@gigsnano/mcp"]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ matrix.package }}" test
      - run: pnpm --filter "${{ matrix.package }}" build
